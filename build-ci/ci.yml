name: DocumentOps CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore DocumentOps.slnx

      - name: Build Solution
        run: dotnet build DocumentOps.slnx --configuration Release --no-restore

      - name: Run Automated Test Suite
        run: dotnet test tests/DocumentOps.Tests/DocumentOps.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Verify Docker Container Build
        run: docker build -t documentops-api:latest -f Dockerfile .
